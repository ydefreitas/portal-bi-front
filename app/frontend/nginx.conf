server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Soporte para React Router (SPA): redirigir todo al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso para el Backend (VM Windows)
    # Esto resuelve los errores de "Mixed Content" (HTTPS -> HTTP)
    location /api {
        proxy_pass https://svprdpbiback.azurewebsites.net/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host svprdpbiback.azurewebsites.net;
        proxy_ssl_server_name on;
        proxy_cache_bypass $http_upgrade;
        
        # Ajustar tiempos de espera por si la conexión es lenta
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass https://svprdpbiback.azurewebsites.net/health;
        proxy_set_header Host svprdpbiback.azurewebsites.net;
        proxy_ssl_server_name on;
    }

    # Comprimir respuestas para mejor rendimiento
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
